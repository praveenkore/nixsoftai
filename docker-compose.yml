services:
  db:
    image: postgres:15-alpine
    container_name: vulnguard-db
    restart: always
    environment:
      POSTGRES_USER: vulnguard
      POSTGRES_PASSWORD: vulnguard_password
      POSTGRES_DB: vulnguard
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vulnguard-frontend
    restart: always
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://vulnguard:vulnguard_password@db:5432/vulnguard
      - NODE_ENV=production
    depends_on:
      - db

volumes:
  postgres_data:
