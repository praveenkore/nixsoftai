benchmark: STIG
id: "V-269268"
title: "AlmaLinux OS 9 SSH daemon must display the date and time of the last successful account logon upon an SSH logon."
stig_id: "ALMA-09-021250"
original_severity: "CAT II"
severity: medium
cci: CCI-000366
srg: SRG-OS-000480-GPOS-00227
vulnerability_id: "V-269268"

rationale: |
  Providing users feedback on when account accesses last occurred facilitates user recognition and reporting of unauthorized account use.

implementations:
  rhel_family:
    os: ["rhel", "centos", "almalinux", "rocky"]
    check:
      type: command
      command: ["sshd", "-T"]
      script: |
        sshd -T | grep -i "^printlastlog" | grep "^printlastlog yes"
      expected_state: "exit_code"
      expected_value: "0"
      description: "Verify PrintLastLog is set to yes"
    remediation:
      commands:
        - "if [ -d /etc/ssh/sshd_config.d ]; then echo 'PrintLastLog yes' > /etc/ssh/sshd_config.d/40-lastlog.conf; else sed -i '/^#*PrintLastLog/c\PrintLastLog yes' /etc/ssh/sshd_config; fi"
        - "systemctl restart sshd.service"
      requires_restart: true
      requires_reboot: false
      description: "Enable display of last logon time"
    rollback:
      commands:
        - "rm -f /etc/ssh/sshd_config.d/40-lastlog.conf"
        - "systemctl restart sshd.service"
      description: "Disable display of last logon time"
