benchmark: STIG
id: "V-269118"
title: "AlmaLinux OS 9 must implement DOD-approved systemwide cryptographic policies to protect the confidentiality of SSH server connections."
stig_id: "ALMA-09-003430"
original_severity: "CAT II"
severity: high
cci: CCI-001453
srg: SRG-OS-000250-GPOS-00093

rationale: |
  AlmaLinux OS 9 incorporates systemwide crypto policies by default. The SSH configuration file
  must handle encryption by including the systemwide policy. This ensures consistent and manageable
  security configurations across the OS.
  Note: This rule is specific to distributions that utilize 'crypto-policies' (RHEL family).

implementations:
  rhel_family:
    os: ["rhel", "centos", "almalinux", "rocky"]
    check:
      type: command
      command: ["grep", "Include /etc/crypto-policies/back-ends/opensshserver.config", "/etc/ssh/sshd_config.d/50-redhat.conf"]
      expected_state: "contains"
      expected_value: "Include /etc/crypto-policies/back-ends/opensshserver.config"
      description: "Verify SSH server includes systemwide crypto policy"
    remediation:
      commands:
        - "dnf reinstall -y openssh-server"
      requires_restart: true
      requires_reboot: false
      description: "Reinstall openssh-server to restore default configuration including crypto policies"
    rollback:
      commands: []
      description: "Manual intervention required for rollback of package reinstallation"
