benchmark: STIG
id: "V-230274"
title: "The operating system must have a host-based firewall installed and enabled."
severity: high
original_severity: "CAT II"
# Firewall is required on all distributions (firewalld for RHEL-based, ufw for Debian-based)
os_compatibility:
  - rhel
  - centos
  - almalinux
  - rocky
  - ubuntu
  - debian
rationale: "A host-based firewall provides network-level protection by controlling inbound and outbound traffic."
check:
  type: command
  command: "systemctl is-active firewalld"
  expected_state: "active"
remediation:
  commands:
    - "yum install -y firewalld"
    - "systemctl enable firewalld"
    - "systemctl start firewalld"
    - "firewall-cmd --set-default-zone=drop"
    - "firewall-cmd --permanent --zone=drop --add-interface=eth0"
    - "firewall-cmd --permanent --add-service=ssh"
    - "firewall-cmd --reload"
  requires_restart: false
  requires_reboot: false
rollback:
  commands:
    - "systemctl stop firewalld"
    - "systemctl disable firewalld"
    - "yum remove -y firewalld"
ai_assist: false
approval_required: true
exception_allowed: true
