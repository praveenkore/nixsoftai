benchmark: STIG
id: "V-269288"
title: "AlmaLinux OS 9 must configure a DNS processing mode set by Network Manager."
stig_id: "ALMA-09-023560"
original_severity: "CAT II"
severity: medium
cci: CCI-000366
srg: SRG-OS-000480-GPOS-00227
vulnerability_id: "V-269288"

rationale: |
  To ensure that DNS resolver settings are respected, a DNS mode in Network Manager must be configured. This prevents unauthorized or unintended DNS changes.

implementations:
  rhel_family:
    os: ["rhel", "centos", "almalinux", "rocky"]
    check:
      type: command
      command: ["bash", "-c"]
      script: |
        if ! command -v NetworkManager >/dev/null 2>&1; then exit 0; fi # Not Applicable
        NetworkManager --print-config | grep -A 10 "\[main\]" | grep -E "^dns=(none|default)"
      expected_state: "exit_code"
      expected_value: "0"
      description: "Verify NetworkManager DNS mode is none or default"
    remediation:
      commands:
        - "sed -i '/^\[main\]/a dns=none' /etc/NetworkManager/NetworkManager.conf"
        - "systemctl reload NetworkManager"
      requires_restart: false
      requires_reboot: false
      description: "Set NetworkManager DNS mode to none"
    rollback:
      commands:
        - "sed -i '/dns=none/d' /etc/NetworkManager/NetworkManager.conf"
        - "systemctl reload NetworkManager"
      description: "Remove DNS mode setting from NetworkManager"
