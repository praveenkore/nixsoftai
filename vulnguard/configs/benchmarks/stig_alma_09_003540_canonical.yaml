benchmark: STIG
id: "V-269119"
title: "AlmaLinux OS 9 SSH server must be configured to use only Message Authentication Codes (MACs) employing FIPS 140-3 validated cryptographic hash algorithms."
stig_id: "ALMA-09-003540"
original_severity: "CAT II"
severity: high
cci: CCI-001453
srg: SRG-OS-000250-GPOS-00093

rationale: |
  Without cryptographic integrity protections, information can be altered by unauthorized users without detection.
  SSH server connections must use FIPS 140-3 validated MACs to ensure integrity.

implementations:
  rhel_family:
    os: ["rhel", "centos", "almalinux", "rocky"]
    check:
      type: command
      command: ["grep", "-i", "macs", "/etc/crypto-policies/back-ends/opensshserver.config"]
      expected_state: "contains"
      expected_value: "hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256"
      description: "Verify SSH server uses FIPS approved MACs in crypto-policies"
    remediation:
      commands:
        - "sed -i -E '/^MACs/s/.*/MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256/' /etc/crypto-policies/back-ends/opensshserver.config"
      requires_restart: true
      requires_reboot: true
      description: "Configure SSH server MACs in crypto-policies"
    rollback:
      commands:
        - "update-crypto-policies --set DEFAULT"
      description: "Reset crypto-policies to DEFAULT"

  debian_family:
    os: ["debian", "ubuntu"]
    check:
      type: command
      command: ["grep", "^MACs", "/etc/ssh/sshd_config"]
      expected_state: "contains"
      expected_value: "hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256"
      description: "Verify SSH server uses FIPS approved MACs in sshd_config"
    remediation:
      commands:
        - "echo 'MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256' >> /etc/ssh/sshd_config"
        - "systemctl reload sshd"
      requires_restart: true
      requires_reboot: false
      description: "Configure SSH server MACs in sshd_config"
    rollback:
      commands:
        - "sed -i '/^MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256/d' /etc/ssh/sshd_config"
        - "systemctl reload sshd"
      description: "Remove enforced MACs from sshd_config"
