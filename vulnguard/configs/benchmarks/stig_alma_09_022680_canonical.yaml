benchmark: STIG
id: "V-269281"
title: "AlmaLinux OS 9 must prevent special devices on file systems that are used with removable media."
stig_id: "ALMA-09-022680"
original_severity: "CAT II"
severity: medium
cci: CCI-000366
srg: SRG-OS-000480-GPOS-00227
vulnerability_id: "V-269281"

rationale: |
  The \"nodev\" mount option causes the system not to interpret character or block special devices. Executing character or blocking special devices from untrusted file systems increases the opportunity for nonprivileged users to attain unauthorized administrative access.

implementations:
  rhel_family:
    os: ["rhel", "centos", "almalinux", "rocky"]
    check:
      type: command
      command: ["bash", "-c"]
      script: |
        # Check fstab for removable media mounts without nodev
        # This is high-level; we check for common removable mount points or types
        grep -Ei "vfat|iso9660|udf" /etc/fstab | grep -iv "nodev" && exit 1
        exit 0
      expected_state: "exit_code"
      expected_value: "0"
      description: "Verify removable media paths in /etc/fstab have nodev option"
    remediation:
      commands:
        - "# Manual remediation: Add 'nodev' to relevant entries in /etc/fstab"
      requires_restart: false
      requires_reboot: false
      description: "Add nodev option to fstab manually"
    rollback:
      commands:
        - "# Manual rollback required"
      description: "Manual rollback required"
