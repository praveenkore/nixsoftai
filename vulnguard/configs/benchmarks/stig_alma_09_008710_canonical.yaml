benchmark: STIG
id: "V-269158"
title: "AlmaLinux OS 9 must display the Standard Mandatory DOD Notice and Consent Banner before granting access to the operating system via a command line user logon."
stig_id: "ALMA-09-008710"
original_severity: "CAT II"
severity: medium
cci: CCI-000048
srg: SRG-OS-000023-GPOS-00006

rationale: |
  The DoD consent banner must be displayed on command line logins (local terminal) via /etc/issue.

implementations:
  rhel_family:
    os: ["rhel", "centos", "almalinux", "rocky"]
    check:
      type: command
      command: ["grep", "U.S. Government (USG) Information System", "/etc/issue"]
      expected_state: "contains"
      expected_value: "U.S. Government (USG) Information System"
      description: "Verify /etc/issue contains USG banner"
    remediation:
      commands:
        - "echo 'You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only.\n\nBy using this IS (which includes any device attached to this IS), you consent to the following conditions:\n\n-The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.\n\n-At any time, the USG may inspect and seize data stored on this IS.\n\n-Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose.\n\n-This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not for your personal benefit or privacy.\n\n-Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are private and confidential. See User Agreement for details.' > /etc/issue"
      requires_restart: false
      requires_reboot: false
      description: "Set /etc/issue to DoD banner"
    rollback:
      commands:
        - "echo '\\S' > /etc/issue"
      description: "Reset /etc/issue to default (distribution info)"

  debian_family:
    os: ["debian", "ubuntu"]
    check:
      type: command
      command: ["grep", "U.S. Government (USG) Information System", "/etc/issue"]
      expected_state: "contains"
      expected_value: "U.S. Government (USG) Information System"
      description: "Verify /etc/issue contains USG banner"
    remediation:
      commands:
        - "echo 'You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only.\n\nBy using this IS (which includes any device attached to this IS), you consent to the following conditions:\n\n-The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.\n\n-At any time, the USG may inspect and seize data stored on this IS.\n\n-Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose.\n\n-This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not for your personal benefit or privacy.\n\n-Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are private and confidential. See User Agreement for details.' > /etc/issue"
      requires_restart: false
      requires_reboot: false
      description: "Set /etc/issue to DoD banner"
    rollback:
      commands:
        - "echo '\\n \\l' > /etc/issue"
      description: "Reset /etc/issue to default"
