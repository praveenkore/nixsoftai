benchmark: STIG
id: "V-269251"
title: "AlmaLinux OS 9 must log packets with impossible addresses."
stig_id: "ALMA-09-019380"
original_severity: "CAT II"
severity: medium
cci: CCI-000366
srg: SRG-OS-000480-GPOS-00227
vulnerability_id: "V-269251"

rationale: |
  The presence of "martian" packets (which have impossible addresses) could be a sign of nefarious network activity. Logging these packets enables this activity to be detected.

implementations:
  rhel_family:
    os: ["rhel", "centos", "almalinux", "rocky"]
    check:
      type: command
      command: ["sysctl", "net.ipv4.conf.all.log_martians"]
      expected_state: "exact"
      expected_value: "net.ipv4.conf.all.log_martians = 1"
      description: "Verify log_martians is enabled"
    remediation:
      commands:
        - "echo 'net.ipv4.conf.all.log_martians = 1' > /etc/sysctl.d/99-stig-log-martians.conf"
        - "echo 'net.ipv4.conf.default.log_martians = 1' >> /etc/sysctl.d/99-stig-log-martians.conf"
        - "sysctl --system"
      requires_restart: false
      requires_reboot: false
      description: "Enable logging of martian packets via sysctl"
    rollback:
      commands:
        - "rm /etc/sysctl.d/99-stig-log-martians.conf"
        - "sysctl --system"
      description: "Remove STIG sysctl configuration"
