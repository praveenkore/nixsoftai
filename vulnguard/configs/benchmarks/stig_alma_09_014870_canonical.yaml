benchmark: STIG
id: "V-269211"
title: "AlmaLinux OS 9 must prevent code from being executed on file systems that contain user home directories."
stig_id: "ALMA-09-014870"
original_severity: "CAT II"
severity: medium
cci: CCI-000366
srg: SRG-OS-000480-GPOS-00230
vulnerability_id: "V-269211"

rationale: |
  The "noexec" mount option causes the system to not execute binary files. This option must be used for mounting any file system not containing approved binary files.

implementations:
  rhel_family:
    os: ["rhel", "centos", "almalinux", "rocky"]
    check:
      type: command
      command: ["mount"]
      expected_state: "script"
      script: |
        mount | grep "on /home " | grep "noexec"
      expected_value: "" # Exit code 0 means grep found it
      description: "Verify /home is mounted with noexec"
    remediation:
      commands:
        - "mount -o remount,noexec /home"
        - "sed -i '/\\/home/ s/defaults/defaults,noexec/' /etc/fstab" # Simple best-effort sed
      requires_restart: false
      requires_reboot: false
      description: "Add noexec option to /home mount"
    rollback:
      commands:
        - "mount -o remount,exec /home"
        - "# Manual fstab revert required"
      description: "Revert noexec option on /home"
