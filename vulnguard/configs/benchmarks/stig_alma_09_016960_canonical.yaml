benchmark: STIG
id: "V-269229"
title: "AlmaLinux OS 9 /etc/shadow file must be group-owned by root."
stig_id: "ALMA-09-016960"
original_severity: "CAT II"
severity: medium
cci: CCI-000366
srg: SRG-OS-000480-GPOS-00227
vulnerability_id: "V-269229"

rationale: |
  The "/etc/shadow" file contains the list of local system accounts and stores password hashes. Protection of this file is critical for system security.

implementations:
  rhel_family:
    os: ["rhel", "centos", "almalinux", "rocky"]
    check:
      type: command
      command: ["stat", "-c", "%G %n", "/etc/shadow"]
      expected_state: "contains"
      expected_value: "root /etc/shadow"
      description: "Verify that /etc/shadow is group-owned by root"
    remediation:
      commands:
        - "chgrp root /etc/shadow"
      requires_restart: false
      requires_reboot: false
      description: "Change group owner of /etc/shadow to root"
    rollback:
      commands:
        - "# Manual rollback required"
      description: "Revert group ownership change"

  debian_family:
    os: ["debian", "ubuntu"]
    check:
      type: command
      command: ["stat", "-c", "%G %n", "/etc/shadow"]
      expected_state: "contains"
      expected_value: "shadow /etc/shadow"
      description: "Verify that /etc/shadow is group-owned by shadow"
    remediation:
      commands:
        - "chgrp shadow /etc/shadow"
      requires_restart: false
      requires_reboot: false
      description: "Change group owner of /etc/shadow to shadow"
    rollback:
      commands:
        - "# Manual rollback required"
      description: "Revert group ownership change"
