benchmark: STIG
id: "V-269287"
title: "AlmaLinux OS 9 must prevent files with the setuid and setgid bit set from being executed on file systems that are imported via Network File System (NFS)."
stig_id: "ALMA-09-023450"
original_severity: "CAT II"
severity: medium
cci: CCI-000366
srg: SRG-OS-000480-GPOS-00227
vulnerability_id: "V-269287"

rationale: |
  The \"nosuid\" mount option causes the system not to execute \"setuid\" and \"setgid\" files with owner privileges. Executing files from untrusted file systems increases the opportunity for nonprivileged users to attain unauthorized administrative access.

implementations:
  rhel_family:
    os: ["rhel", "centos", "almalinux", "rocky"]
    check:
      type: command
      command: ["bash", "-c"]
      script: |
        # Check fstab for NFS mounts without nosuid
        grep -i "nfs" /etc/fstab | grep -iv "nosuid" && exit 1
        exit 0
      expected_state: "exit_code"
      expected_value: "0"
      description: "Verify NFS mounts in /etc/fstab have nosuid option"
    remediation:
      commands:
        - "# Manual remediation: Add 'nosuid' to NFS entries in /etc/fstab"
      requires_restart: false
      requires_reboot: false
      description: "Add nosuid option to NFS mounts in fstab manually"
    rollback:
      commands:
        - "# Manual rollback required"
      description: "Manual rollback required"
