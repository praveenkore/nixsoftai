benchmark: STIG
id: "V-230270"
title: "The operating system must use a Mandatory Access Control (MAC) system to enforce access restrictions."
severity: high
original_severity: "CAT II"
# AppArmor is Ubuntu/Debian specific; SELinux is for RHEL-based systems
# This rule checks for the appropriate MAC system based on OS
os_compatibility:
  - rhel
  - centos
  - almalinux
  - rocky
  - ubuntu
  - debian
rationale: "Mandatory Access Control (MAC) systems like SELinux or AppArmor enforce security policies that restrict program behavior."
check:
  type: command
  command: "getenforce"
  expected_state: "Enforcing"
remediation:
  commands:
    - "setenforce 1"
    - "sed -i 's/^SELINUX=.*/SELINUX=enforcing/' /etc/selinux/config"
  requires_restart: true
  requires_reboot: true
rollback:
  commands:
    - "setenforce 0"
    - "sed -i 's/^SELINUX=.*/SELINUX=permissive/' /etc/selinux/config"
ai_assist: false
approval_required: true
exception_allowed: true
