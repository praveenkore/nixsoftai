benchmark: STIG
id: "V-269260"
title: "AlmaLinux OS 9 SSH daemon must not allow compression or must only allow compression after successful authentication."
stig_id: "ALMA-09-020370"
original_severity: "CAT II"
severity: medium
cci: CCI-000366
srg: SRG-OS-000480-GPOS-00227
vulnerability_id: "V-269260"

rationale: |
  If compression is allowed in an SSH connection prior to authentication, vulnerabilities in the compression software could result in compromise of the system from an unauthenticated connection, potentially with root privileges.

implementations:
  rhel_family:
    os: ["rhel", "centos", "almalinux", "rocky"]
    check:
      type: command
      command: ["sshd", "-T"]
      script: |
        sshd -T | grep -i "^compression" | grep -Ei "delayed|no"
      expected_state: "exit_code"
      expected_value: "0"
      description: "Verify SSH compression is set to no or delayed"
    remediation:
      commands:
        - "if [ -d /etc/ssh/sshd_config.d ]; then echo 'Compression no' > /etc/ssh/sshd_config.d/40-compression.conf; else sed -i '/^#*Compression/c\Compression no' /etc/ssh/sshd_config; fi"
        - "systemctl restart sshd.service"
      requires_restart: true
      requires_reboot: false
      description: "Disable SSH compression"
    rollback:
      commands:
        - "rm -f /etc/ssh/sshd_config.d/40-compression.conf"
        - "systemctl restart sshd.service"
      description: "Remove SSH compression restriction"
