# VulnGuard Canonical STIG Rule V-230269
# Refactored for multi-distribution support
# AIDE (Advanced Intrusion Detection Environment) must be installed

benchmark: STIG
id: "V-230269"
title: "The operating system must use a file integrity tool to monitor system files."
original_severity: "CAT II"
severity: high
rationale: >
  AIDE (Advanced Intrusion Detection Environment) is a file integrity checking 
  tool that monitors system files and directories for unauthorized changes. 
  When AIDE is properly configured and running, it detects and logs 
  modifications to critical system files, providing early detection of 
  compromise attempts and supporting compliance requirements for file 
  integrity monitoring.

implementations:
  rhel_family:
    os: ["rhel", "centos", "almalinux", "rocky"]
    check:
      type: command
      parameter: ["rpm", "-q", "aide"]
      expected_state: "package aide is installed"
      expected_type: string
    remediation:
      commands:
        - "yum install -y aide"
      requires_restart: false
      requires_reboot: false
    rollback:
      commands:
        - "yum remove -y aide"

  debian_family:
    os: ["debian", "ubuntu"]
    check:
      type: command
      parameter: ["dpkg", "-l", "|", "grep", "-q", "^ii  aide"]
      expected_state: "package aide is installed"
      expected_type: string
    remediation:
      commands:
        - "apt-get install -y aide"
      requires_restart: false
      requires_reboot: false
    rollback:
      commands:
        - "apt-get remove -y aide"

approval_required: true
exception_allowed: false
ai_assist: false
