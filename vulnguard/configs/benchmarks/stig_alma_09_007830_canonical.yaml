benchmark: STIG
id: "V-269150"
title: "AlmaLinux OS 9 must configure the use of the pam_faillock.so module in the /etc/pam.d/system-auth file."
stig_id: "ALMA-09-007830"
original_severity: "CAT II"
severity: medium
cci: CCI-000044
srg: SRG-OS-000021-GPOS-00005

rationale: |
  The pam_faillock module provides the capability to lock out accounts after a specified number of failed login attempts,
  preventing brute-force attacks.

implementations:
  rhel_family:
    os: ["rhel", "centos", "almalinux", "rocky"]
    check:
      type: command
      command: ["grep", "pam_faillock.so", "/etc/pam.d/system-auth"]
      expected_state: "contains"
      expected_value: "auth required pam_faillock.so preauth"
      description: "Verify pam_faillock.so is configured in system-auth"
    remediation:
      commands:
        - "authselect enable-feature with-faillock"
        - "authselect apply-changes"
      requires_restart: false
      requires_reboot: false
      description: "Enable with-faillock feature using authselect"
    rollback:
      commands:
        - "authselect disable-feature with-faillock"
        - "authselect apply-changes"
      description: "Disable with-faillock feature"
