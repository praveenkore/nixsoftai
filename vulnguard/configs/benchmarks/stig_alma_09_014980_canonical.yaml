benchmark: STIG
id: "V-269212"
title: "A separate file system must be used for user home directories (such as /home or an equivalent)."
stig_id: "ALMA-09-014980"
original_severity: "CAT II"
severity: medium
cci: CCI-000366
srg: SRG-OS-000480-GPOS-00230
vulnerability_id: "V-269212"

rationale: |
  Ensuring that "/home" is mounted on its own partition enables the setting of more restrictive mount options.

implementations:
  rhel_family:
    os: ["rhel", "centos", "almalinux", "rocky"]
    check:
      type: command
      command: ["mount"]
      expected_state: "script"
      script: |
        mount | grep "on /home "
      expected_value: "" # Exit code 0 if found
      description: "Verify that /home is a separate mount point"
    remediation:
      commands:
        - "# Manual remediation required: /home must be migrated to a separate partition."
      requires_restart: false
      requires_reboot: false
      description: "Manual remediation required to separate /home partition"
    rollback:
      commands:
        - "# Manual rollback required"
      description: "Manual rollback"
