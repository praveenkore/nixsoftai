# VulnGuard Canonical STIG Rule V-230264
# Refactored for multi-distribution support
# Addresses Space Layout Randomization (ASLR) security control

benchmark: STIG
id: "V-230264"
title: "The operating system must configure kernel parameters to enable ASLR."
original_severity: "CAT II"
severity: high
rationale: >
  Address Space Layout Randomization (ASLR) makes it harder for attackers to 
  predict memory addresses by randomizing the location of stack, heap, 
  libraries, and other memory regions. This is implemented by setting 
  kernel.randomize_va_space=2, which randomizes the virtual address 
  space layout for 64-bit processes.

implementations:
  rhel_family:
    os: ["rhel", "centos", "almalinux", "rocky"]
    check:
      type: sysctl
      parameter: "kernel.randomize_va_space"
      expected_state: "2"
      expected_type: integer
    remediation:
      commands:
        - "sysctl -w kernel.randomize_va_space=2"
      requires_restart: false
      requires_reboot: true
    rollback:
      commands:
        - "sysctl -w kernel.randomize_va_space=1"

  debian_family:
    os: ["debian", "ubuntu"]
    check:
      type: sysctl
      parameter: "kernel.randomize_va_space"
      expected_state: "2"
      expected_type: integer
    remediation:
      commands:
        - "sysctl -w kernel.randomize_va_space=2"
      requires_restart: false
      requires_reboot: true
    rollback:
      commands:
        - "sysctl -w kernel.randomize_va_space=1"

approval_required: true
exception_allowed: false
ai_assist: false
