benchmark: STIG
id: "V-269204"
title: "AlmaLinux OS 9 /etc/gshadow file must be owned by root."
stig_id: "ALMA-09-014100"
original_severity: "CAT II"
severity: medium
cci: CCI-000366
srg: SRG-OS-000480-GPOS-00227
vulnerability_id: "V-269204"

rationale: |
  The "/etc/gshadow" file contains group password hashes. Protection of this file is critical for system security.

implementations:
  rhel_family:
    os: ["rhel", "centos", "almalinux", "rocky"]
    check:
      type: command
      command: ["stat", "-c", "%U %n", "/etc/gshadow"]
      expected_state: "contains"
      expected_value: "root /etc/gshadow"
      description: "Verify that /etc/gshadow is owned by root"
    remediation:
      commands:
        - "chown root /etc/gshadow"
      requires_restart: false
      requires_reboot: false
      description: "Change owner of /etc/gshadow to root"
    rollback:
      commands:
        - "# Manual rollback required"
      description: "Revert ownership change"

  debian_family:
    os: ["debian", "ubuntu"]
    check:
      type: command
      command: ["stat", "-c", "%U %n", "/etc/gshadow"]
      expected_state: "contains"
      expected_value: "root /etc/gshadow"
      description: "Verify that /etc/gshadow is owned by root"
    remediation:
      commands:
        - "chown root /etc/gshadow"
      requires_restart: false
      requires_reboot: false
      description: "Change owner of /etc/gshadow to root"
    rollback:
      commands:
        - "# Manual rollback required"
      description: "Revert ownership change"
