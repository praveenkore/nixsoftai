benchmark: STIG
id: "V-269113"
title: "AlmaLinux OS 9 SSH client must be configured to use only encryption ciphers employing FIPS 140-3 validated cryptographic hash algorithms."
stig_id: "ALMA-09-002990"
original_severity: "CAT II"
severity: high
cci: CCI-001453
srg: SRG-OS-000250-GPOS-00093

rationale: |
  Without cryptographic integrity protections, information can be altered by unauthorized users without detection.
  SSH client connections must use FIPS 140-3 validated ciphers to ensure confidentiality.

implementations:
  rhel_family:
    os: ["rhel", "centos", "almalinux", "rocky"]
    check:
      type: command
      command: ["grep", "-i", "ciphers", "/etc/crypto-policies/back-ends/openssh.config"]
      expected_state: "contains"
      expected_value: "aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes128-ctr"
      description: "Verify SSH client uses FIPS approved ciphers in crypto-policies"
    remediation:
      commands:
        - "sed -i -E '/^Ciphers/s/.*/Ciphers aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes128-ctr/' /etc/crypto-policies/back-ends/openssh.config"
      requires_restart: false
      requires_reboot: true
      description: "Configure SSH client ciphers in crypto-policies"
    rollback:
      commands:
        - "update-crypto-policies --set DEFAULT"
      description: "Reset crypto-policies to DEFAULT"

  debian_family:
    os: ["debian", "ubuntu"]
    check:
      type: command
      command: ["grep", "^Ciphers", "/etc/ssh/ssh_config"]
      expected_state: "contains"
      expected_value: "aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes128-ctr"
      description: "Verify SSH client uses FIPS approved ciphers in ssh_config"
    remediation:
      commands:
        - "echo 'Ciphers aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes128-ctr' >> /etc/ssh/ssh_config"
      requires_restart: false
      requires_reboot: false
      description: "Configure SSH client ciphers in ssh_config"
    rollback:
      commands:
        - "sed -i '/^Ciphers aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes128-ctr/d' /etc/ssh/ssh_config"
      description: "Remove enforced Ciphers from ssh_config"
