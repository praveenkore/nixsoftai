benchmark: STIG
id: "V-269170"
title: "AlmaLinux OS 9 system commands must be owned by root."
stig_id: "ALMA-09-010360"
original_severity: "CAT II"
severity: medium
cci: CCI-001499
srg: SRG-OS-000259-GPOS-00100

rationale: |
  System commands must be owned by root to prevent unauthorized users from modifying them
  and escalating privileges or compromising the system.

implementations:
  rhel_family:
    os: ["rhel", "centos", "almalinux", "rocky"]
    check:
      type: command
      command: ["find", "-L", "/bin", "/sbin", "/usr/bin", "/usr/sbin", "/usr/libexec", "/usr/local/bin", "/usr/local/sbin", "!", "-user", "root", "-exec", "ls", "-l", "{}", ";"]
      expected_state: "empty"
      expected_value: ""
      description: "Verify system commands are owned by root"
    remediation:
      commands:
        - "echo 'Manual intervention required: Run find command to identify and chown non-compliant files'"
      requires_restart: false
      requires_reboot: false
      description: "Manual fix required for system file ownership"
    rollback:
      commands: []
      description: "Manual rollback"

  debian_family:
    os: ["debian", "ubuntu"]
    check:
      type: command
      command: ["find", "-L", "/bin", "/sbin", "/usr/bin", "/usr/sbin", "/usr/libexec", "/usr/local/bin", "/usr/local/sbin", "!", "-user", "root", "-exec", "ls", "-l", "{}", ";"]
      expected_state: "empty"
      expected_value: ""
      description: "Verify system commands are owned by root"
    remediation:
      commands:
        - "echo 'Manual intervention required: Run find command to identify and chown non-compliant files'"
      requires_restart: false
      requires_reboot: false
      description: "Manual fix required for system file ownership"
    rollback:
      commands: []
      description: "Manual rollback"
