benchmark: STIG
id: "V-269213"
title: "All AlmaLinux OS 9 local interactive users must have a home directory assigned in the /etc/passwd file."
stig_id: "ALMA-09-015090"
original_severity: "CAT II"
severity: medium
cci: CCI-000366
srg: SRG-OS-000480-GPOS-00230
vulnerability_id: "V-269213"

rationale: |
  If local interactive users are not assigned a valid home directory, there is no place for the storage and control of files they should own.

implementations:
  rhel_family:
    os: ["rhel", "centos", "almalinux", "rocky"]
    check:
      type: command
      command: []
      script: |
        awk -F: '($3>=1000)&&($7 !~ /nologin/){print $6}' /etc/passwd | while read dir; do
          if [ -z "$dir" ]; then
            exit 1
          fi
        done
        exit 0
      expected_state: "exit_code"
      expected_value: "0"
      description: "Verify that all interactive users have a home directory defined"
    remediation:
      commands:
        - "# Manual remediation required: Assign home directories to users missing them."
      requires_restart: false
      requires_reboot: false
      description: "Manual remediation required"
    rollback:
      commands:
        - "# Manual rollback required"
      description: "Manual rollback required"
