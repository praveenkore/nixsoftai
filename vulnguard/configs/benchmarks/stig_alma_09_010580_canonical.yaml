benchmark: STIG
id: "V-269172"
title: "AlmaLinux OS 9 library directories must be group-owned by root or a system account."
stig_id: "ALMA-09-010580"
original_severity: "CAT II"
severity: medium
cci: CCI-001499
srg: SRG-OS-000259-GPOS-00100

rationale: |
  System libraries in /lib, /usr/lib, etc., must be group-owned by root or a system account
  to prevent unauthorized modification.

implementations:
  rhel_family:
    os: ["rhel", "centos", "almalinux", "rocky"]
    check:
      type: command
      command: ["find", "-L", "/lib", "/lib64", "/usr/lib", "/usr/lib64", "!", "-group", "root", "-type", "d", "-exec", "ls", "-ld", "{}", ";"]
      expected_state: "empty"
      expected_value: ""
      description: "Verify library directories are group-owned by root"
    remediation:
      commands:
        - "echo 'Manual intervention required: Run find command to identify and chgrp non-compliant directories'"
      requires_restart: false
      requires_reboot: false
      description: "Manual fix required for library directory group"
    rollback:
      commands: []
      description: "Manual rollback"

  debian_family:
    os: ["debian", "ubuntu"]
    check:
      type: command
      command: ["find", "-L", "/lib", "/lib64", "/usr/lib", "/usr/lib64", "!", "-group", "root", "-type", "d", "-exec", "ls", "-ld", "{}", ";"]
      expected_state: "empty"
      expected_value: ""
      description: "Verify library directories are group-owned by root"
    remediation:
      commands:
        - "echo 'Manual intervention required: Run find command to identify and chgrp non-compliant directories'"
      requires_restart: false
      requires_reboot: false
      description: "Manual fix required for library directory group"
    rollback:
      commands: []
      description: "Manual rollback"
