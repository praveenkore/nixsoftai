benchmark: STIG
id: "V-269169"
title: "AlmaLinux OS 9 system commands must be group-owned by root or a system account."
stig_id: "ALMA-09-010250"
original_severity: "CAT II"
severity: medium
cci: CCI-001499
srg: SRG-OS-000259-GPOS-00100

rationale: |
  System commands in /bin, /sbin, /usr/bin, etc., must be group-owned by root or a system account
  to prevent unauthorized users from modifying them and escalating privileges.

implementations:
  rhel_family:
    os: ["rhel", "centos", "almalinux", "rocky"]
    check:
      type: command
      command: ["find", "-L", "/bin", "/sbin", "/usr/bin", "/usr/sbin", "/usr/local/bin", "/usr/local/sbin", "!", "-group", "root", "-exec", "ls", "-l", "{}", ";"]
      expected_state: "empty"
      expected_value: ""
      description: "Verify system commands are group-owned by root"
    remediation:
      commands:
        - "echo 'Manual intervention required: Run find command to identify and chgrp non-compliant files'"
      requires_restart: false
      requires_reboot: false
      description: "Manual fix required for system file ownership"
    rollback:
      commands: []
      description: "Manual rollback"

  debian_family:
    os: ["debian", "ubuntu"]
    check:
      type: command
      command: ["find", "-L", "/bin", "/sbin", "/usr/bin", "/usr/sbin", "/usr/local/bin", "/usr/local/sbin", "!", "-group", "root", "-exec", "ls", "-l", "{}", ";"]
      expected_state: "empty"
      expected_value: ""
      description: "Verify system commands are group-owned by root"
    remediation:
      commands:
        - "echo 'Manual intervention required: Run find command to identify and chgrp non-compliant files'"
      requires_restart: false
      requires_reboot: false
      description: "Manual fix required for system file ownership"
    rollback:
      commands: []
      description: "Manual rollback"
