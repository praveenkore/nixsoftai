benchmark: STIG
id: "V-269284"
title: "AlmaLinux OS 9 must disable the use of user namespaces."
stig_id: "ALMA-09-023010"
original_severity: "CAT II"
severity: medium
cci: CCI-000366
srg: SRG-OS-000480-GPOS-00227
vulnerability_id: "V-269284"

rationale: |
  User namespaces are used primarily for Linux containers. Disallowing the use of user namespaces reduces the attack surface of the kernel.

implementations:
  rhel_family:
    os: ["rhel", "centos", "almalinux", "rocky"]
    check:
      type: command
      command: ["sysctl", "user.max_user_namespaces"]
      expected_state: "exact"
      expected_value: "user.max_user_namespaces = 0"
      description: "Verify user.max_user_namespaces is set to 0"
    remediation:
      commands:
        - "echo 'user.max_user_namespaces = 0' > /etc/sysctl.d/99-stig-user-namespaces.conf"
        - "sysctl --system"
      requires_restart: false
      requires_reboot: false
      description: "Disable user namespaces via sysctl"
    rollback:
      commands:
        - "rm -f /etc/sysctl.d/99-stig-user-namespaces.conf"
        - "sysctl --system"
      description: "Re-enable user namespaces"
