benchmark: STIG
id: "V-230269"
title: "The operating system must use a file integrity tool to verify correct operation of security functions."
severity: high
original_severity: "CAT II"
# Universal - AIDE is available on all distributions (use appropriate package manager)
os_compatibility:
  - rhel
  - centos
  - almalinux
  - rocky
  - ubuntu
  - debian
rationale: "AIDE is a file integrity tool that monitors changes to critical system files, directories, and configurations. Without file integrity monitoring, unauthorized changes to system files may go undetected."
check:
  type: command
  command: "rpm -q aide"
  expected_state: "0"
remediation:
  commands:
    - "yum install -y aide"
    - "aide --init"
    - "mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz"
  requires_restart: false
  requires_reboot: false
rollback:
  commands:
    - "yum remove -y aide"
    - "rm -f /var/lib/aide/aide.db.gz"
ai_assist: false
approval_required: true
exception_allowed: true
