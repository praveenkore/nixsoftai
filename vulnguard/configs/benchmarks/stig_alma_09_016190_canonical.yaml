benchmark: STIG
id: "V-269222"
title: "AlmaLinux OS 9 /etc/passwd- file must have mode 0644 or less permissive to prevent unauthorized access."
stig_id: "ALMA-09-016190"
original_severity: "CAT II"
severity: medium
cci: CCI-000366
srg: SRG-OS-000480-GPOS-00227
vulnerability_id: "V-269222"

rationale: |
  The "/etc/passwd-" file is a backup file of "/etc/passwd", and as such, contains information about the users that are configured on the system. Protection of this file is critical for system security.

implementations:
  rhel_family:
    os: ["rhel", "centos", "almalinux", "rocky"]
    check:
      type: command
      command: ["stat", "-c", "%a %n", "/etc/passwd-"]
      expected_state: "regex"
      expected_value: "^(644|640|600) /etc/passwd-$"
      description: "Verify that /etc/passwd- has mode 0644 or less permissive"
    remediation:
      commands:
        - "chmod 0644 /etc/passwd-"
      requires_restart: false
      requires_reboot: false
      description: "Set mode of /etc/passwd- to 0644"
    rollback:
      commands:
        - "# Manual rollback required"
      description: "Revert permissions change"
