benchmark: STIG
id: "V-269192"
title: "AlmaLinux OS 9 /etc/group- file must be owned by root."
stig_id: "ALMA-09-012780"
original_severity: "CAT II"
severity: medium
cci: CCI-000366
srg: SRG-OS-000480-GPOS-00227

rationale: |
  The /etc/group- file must be owned by root.

implementations:
  rhel_family:
    os: ["rhel", "centos", "almalinux", "rocky"]
    check:
      type: command
      command: ["stat", "-c", "%U", "/etc/group-"]
      expected_state: "exact"
      expected_value: "root"
      description: "Verify /etc/group- is owned by root"
    remediation:
      commands:
        - "chown root /etc/group-"
      requires_restart: false
      requires_reboot: false
      description: "Set ownership of /etc/group- to root"
    rollback:
      commands: []
      description: "Manual rollback"

  debian_family:
    os: ["debian", "ubuntu"]
    check:
      type: command
      command: ["stat", "-c", "%U", "/etc/group-"]
      expected_state: "exact"
      expected_value: "root"
      description: "Verify /etc/group- is owned by root"
    remediation:
      commands:
        - "chown root /etc/group-"
      requires_restart: false
      requires_reboot: false
      description: "Set ownership of /etc/group- to root"
    rollback:
      commands: []
      description: "Manual rollback"
